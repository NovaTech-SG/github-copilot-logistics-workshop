name: Workshop CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - copilot-logistics-dashboard-starter
          - copilot-logistics-dashboard
          - copilot-shipment-tracker-starter
          - copilot-shipment-tracker
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python tools/bootstrap_training.py
      - run: uv run --locked python tools/check_training.py
      - name: Dashboard starter syntax
        if: matrix.project == 'copilot-logistics-dashboard-starter'
        run: uv run --locked python -m compileall -q app.py services
      - name: Offline tests
        if: matrix.project != 'copilot-logistics-dashboard-starter'
        run: uv run --locked python -m unittest discover -s tests -v
      - run: node --check static/app.js
